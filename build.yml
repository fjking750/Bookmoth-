name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create the Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init Bookmoth com.bookmoth.app --web-dir www
          npx cap add android

      - name: Add camera and location permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          npx cap sync android

      - name: Set the app icon
        run: |
          IM=$(command -v magick || command -v convert)
          R=android/app/src/main/res
          if [ -f icon.png ]; then
            for p in mdpi:108:48 hdpi:162:72 xhdpi:216:96 xxhdpi:324:144 xxxhdpi:432:192; do
              IFS=: read d f l <<< "$p"
              mkdir -p $R/mipmap-$d
              $IM icon.png -resize ${f}x${f} $R/mipmap-$d/ic_launcher_foreground.png
              $IM icon.png -resize ${l}x${l} $R/mipmap-$d/ic_launcher.png
              $IM icon.png -resize ${l}x${l} $R/mipmap-$d/ic_launcher_round.png
            done
            mkdir -p $R/mipmap-anydpi-v26 $R/values
            for n in ic_launcher ic_launcher_round; do
          cat > $R/mipmap-anydpi-v26/$n.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
            done
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#1B1464</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
          fi

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bookmoth-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
