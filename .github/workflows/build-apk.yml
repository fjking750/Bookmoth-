name: Build APK 2
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create the Android project
        run: |
          test -f index.html || { echo "::error::index.html is missing from the repo root"; exit 1; }
          mkdir -p www
          cp index.html www/
          cat > www/updater.js <<'UPDATER_EOF'
          // Bookmoth auto-update.
          (function () {
            var REPO = 'fjking750/Bookmoth-';

            async function run() {
              var Cap = window.Capacitor;
              if (!Cap || (Cap.getPlatform && Cap.getPlatform() === 'web')) return;

              var U = (Cap.Plugins && Cap.Plugins.CapacitorUpdater) ||
                      (Cap.registerPlugin && Cap.registerPlugin('CapacitorUpdater'));
              if (!U) return;

              try {
                await U.notifyAppReady();

                var res = await fetch('https://api.github.com/repos/' + REPO + '/releases/latest');
                if (!res.ok) return;
                var rel = await res.json();

                var latest = parseInt(String(rel.tag_name).replace(/^v/, ''), 10);
                var asset = (rel.assets || []).find(function (a) { return a.name === 'www.zip'; });
                if (!latest || !asset) return;

                var current = await U.current();
                var have = parseInt(current.bundle.version, 10) || 0;
                if (latest <= have) return;

                var bundle = await U.download({
                  url: asset.browser_download_url,
                  version: String(latest)
                });
                await U.set({ id: bundle.id });
              } catch (e) {
                console.warn('Update check failed:', e);
              }
            }

            if (document.readyState === 'complete') run();
            else window.addEventListener('load', run);
          })();
          UPDATER_EOF
          if grep -qi '</body>' www/index.html; then
            sed -i 's#</body>#<script src="updater.js"></script></body>#I' www/index.html
          else
            echo '<script src="updater.js"></script>' >> www/index.html
          fi
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capgo/capacitor-updater@7 @capacitor/browser@7
          npx cap init Bookmoth com.bookmoth.app --web-dir www
          node -e "const fs=require('fs'),f='capacitor.config.json',c=JSON.parse(fs.readFileSync(f));c.plugins={...c.plugins,CapacitorUpdater:{autoUpdate:false}};fs.writeFileSync(f,JSON.stringify(c,null,2))"
          npx cap add android
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Add camera and location permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' $M
          npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: bookmoth-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
