name: Publish update

on:
  push:
    branches: [main]
    paths:
      - index.html
      - updater.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the web app
        run: |
          test -f index.html || { echo "::error::index.html is missing from the repo root"; exit 1; }
          test -f updater.js || { echo "::error::updater.js is missing from the repo root - check the spelling"; exit 1; }
          mkdir www
          cp index.html updater.js www/
          if grep -qi '</body>' www/index.html; then
            sed -i 's#</body>#<script src="updater.js"></script></body>#I' www/index.html
          else
            echo '<script src="updater.js"></script>' >> www/index.html
          fi
          cd www && zip -r ../www.zip .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Update ${{ github.run_number }}
          files: www.zip
